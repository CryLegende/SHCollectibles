# ======================================================================== #
#                       SHDetecteur - Configuration                        #
# ======================================================================== #
#
# Détecteur de collectibles TheSearch : le joueur l'active pour une collection. Une flèche l'emmène vers le
# collectible restant le plus proche, disparaît quand il est tout près, et le collectible fait un petit bruit à
# intervalle régulier. Une fois trouvé, la flèche repart vers le suivant.
#
# Le détecteur lit les collectibles, leurs positions et les trouvailles dans TheSearch. Il garde ses conditions :
# la permission thesearch.search.<collection> est exigée comme pour ramasser le collectible. Il s'arrête à la
# déconnexion ou quand la collection est complète.
#
# La flèche est dessinée par un plugin qui lit %shdetecteur_cible% (SHGuide, section « fleches »).
#
# Commandes :
#   /detecteur <collection>       Active le détecteur de la collection, l'arrête s'il était déjà actif (shdetecteur.use).
#   /detecteur                    Arrête le détecteur (shdetecteur.use).
#   /shdetecteur reload           Recharge config.yml et messages.yml (shdetecteur.admin.reload).
#   /shdetecteur info <joueur>    Collection, cible et distance d'un joueur (shdetecteur.admin.info).
#
# Permissions :
#   shdetecteur.use                   Se servir du détecteur.
#   shdetecteur.admin                 Toutes les sous-commandes de /shdetecteur.
#   shdetecteur.admin.<sous-commande> reload, info.
#
# Placeholders :
#   %shdetecteur_cible%               Lieu que la flèche doit montrer, « monde x y z ». Vide quand le détecteur est
#                                     arrêté, que le collectible est tout près ou dans un autre monde.
#   %shdetecteur_nom%                 Nom du collectible cherché (objet de la collection). Vide si arrêté.
#   %shdetecteur_collection%          Collection du détecteur actif. Vide si arrêté.
#   %shdetecteur_menu_<collection>%   Ligne de menu : activer, arrêter ou collection complète (messages.yml).
#
# Un reload valide config.yml et messages.yml avant de les appliquer : si l'un est invalide, rien ne change et le
# message donne le fichier et l'erreur.
#
# ======================================================================== #

# Commande lancée par le joueur à l'activation quand il n'est pas dans un monde où il reste des collectibles
# (vide = aucune).
commande-autre-monde: "spawn"

# Distances en blocs.
distances:
  # La flèche disparaît à moins de « proche » blocs et revient au-delà de « loin ».
  proche: 15
  loin: 20
  # La cible change pour un collectible plus proche seulement s'il l'est d'au moins « changement » blocs.
  changement: 20

# Petit bruit du collectible cherché, joué à sa place. « volume » 2 s'entend jusqu'à 32 blocs (16 blocs par unité).
# Chaque collection peut avoir son propre volume et sa propre hauteur.
bruit:
  intervalle-ticks: 40
  volume: 2.0
  hauteur: 1.0

# Collections qui ont un détecteur : nom exact de la recherche TheSearch (plugins/TheSearch/searches/<nom>.yml).
#   couleur   couleur des textes de la collection
#   nom       nom de la collection dans les messages
#   objet     nom d'un collectible (au-dessus de la flèche)
#   bruit     son du collectible, et « volume » / « hauteur » s'ils diffèrent de ceux de « bruit » plus haut
collections:
  Exemple:
    couleur: "&#FF9A2B"
    nom: "Cookies"
    objet: "Cookie"
    bruit: "minecraft:entity.generic.eat"
