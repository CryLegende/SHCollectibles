# ======================================================================== #
#                      SHCollectibles - Configuration                      #
# ======================================================================== #
#
# Collections de têtes cachées dans le monde : un clic droit sur une tête la compte, donne la récompense de la
# collection, et celle de fin quand tout est trouvé. Une collection par fichier de collections/ (le nom du fichier est
# son identifiant, gardé avec les trouvailles : ne pas le renommer).
#
# Le détecteur guide un joueur vers le collectible au chemin le plus court : le plugin connaît le monde (section
# « guidage ») et suit le vrai trajet à pied, avec ses détours, escaliers, portes, échelles et doubles sauts. La flèche suit
# le chemin jusqu'à la zone de fouille (section « fouille ») : là, elle laisse la place à une barre qui dit si l'on chauffe,
# et le collectible fait un petit bruit quand il est proche à pied. Un collectible ajouté est guidé tout seul. La flèche
# ne mène pas pile au collectible mais à quelques blocs de lui (section « approximation »). Un joueur ne suit qu'un nombre
# limité de collections par jour, et le détecteur ne le mène qu'à un nombre limité de collectibles par jour.
#
# Fichiers : config.yml (ce fichier), messages.yml (tous les textes), zones.yml (compte des collectibles par zone),
# collections/ (têtes, récompenses, effets). Tout se change sans toucher au code, puis /shcollectibles reload.
#
# Commandes :
#   /detecteur <collection>       Active le détecteur de la collection, l'arrête s'il était déjà actif.
#   /detecteur                    Arrête le détecteur.
#   /shcollectibles reload        Recharge config.yml, messages.yml, zones.yml et collections/.
#   /shcollectibles list [collection]                           Collections, ou collectibles d'une collection.
#   /shcollectibles info <joueur>                               Trouvailles et détecteur d'un joueur connecté.
#   /shcollectibles add <collection>                            Ajoute le bloc visé à la collection.
#   /shcollectibles remove                                      Retire le bloc visé de sa collection.
#   /shcollectibles step <collection> <numéro> <add|clear>      Étape de secours là où vous êtes, ou les efface.
#   /shcollectibles tp <collection> <numéro>                    Se téléporter au collectible.
#   /shcollectibles give <joueur> <collection> <numéro>         Donne un collectible, avec sa récompense.
#   /shcollectibles reset <joueur|*> <collection|*>             Efface des trouvailles.
#   /shcollectibles limit <joueur>                              Rend à un joueur sa limite du jour (detecteur.limite).
#   /shcollectibles enable|disable <collection>                 Ouvre ou ferme une collection.
#   /shcollectibles zones [zone]                                Zones et leur compte, ou collectibles d'une zone.
#   /shcollectibles map                                         État des cartes.
#   /shcollectibles map rebuild                                 Relit le monde (après des travaux au spawn).
#   /shcollectibles map check                                   Chemin de chaque collectible depuis le départ : longueur,
#                                                               chutes, sauts, et ceux qui ne sont pas atteints à pied.
#   /shcollectibles import <dossier players>                    Console : reprend les trouvailles de TheSearch. Une ligne
#                                                               déjà enregistrée n'est pas touchée.
#
# Permissions :
#   shcollectibles.detecteur             Se servir du détecteur.
#   shcollectibles.detecteur.illimite    Pas de limite par jour.
#   shcollectibles.admin                 Toutes les sous-commandes de /shcollectibles.
#   shcollectibles.admin.<sous-commande> reload, list, info, add, remove, step, tp, give, reset, limit, enable, disable,
#                                        zones, map, import.
#   La permission exigée pour une collection est réglée par « permission » plus bas.
#
# Placeholders (<c> = identifiant de la collection, <z> = identifiant de la zone) :
#   %shcollectibles_total_found_objects_<c>%           Collectibles trouvés.
#   %shcollectibles_remaining_objects_<c>%             Collectibles restants.
#   %shcollectibles_total_objects_<c>%                 Collectibles de la collection.
#   %shcollectibles_has_completed_<c>%                 true si la collection est complète.
#   %shcollectibles_has_found_object_<c>_<numéro>%     true si ce collectible est trouvé.
#   %shcollectibles_total_players_with_completed_<c>%  Joueurs qui ont complété la collection.
#   %shcollectibles_total_completed_searches%          Collections complètes du joueur.
#   %shcollectibles_is_enabled_<c>%                    true si la collection est ouverte.
#   %shcollectibles_zone_<z>%                          Ligne « trouvés 2/3 » de la zone (messages.yml), vide si elle n'a
#                                                      aucun collectible.
#   %shcollectibles_zone_trouves_<z>%                  Collectibles trouvés dans la zone.
#   %shcollectibles_zone_total_<z>%                    Collectibles de la zone.
#   %shcollectibles_menu_<c>%                          Ligne de menu du détecteur : activer, arrêter, limite du jour
#                                                      atteinte ou complète.
#   %shcollectibles_cible%                             Chemin que la flèche doit suivre, « monde x y z x y z … » du
#                                                      joueur vers l'avant. Vide quand le détecteur est arrêté ou le
#                                                      joueur dans la zone de fouille.
#   %shcollectibles_fleche%                            Texte au-dessus de la flèche.
#   %shcollectibles_fin%                               Texte d'adieu de la flèche dans la zone de fouille, vide ailleurs.
#   %shcollectibles_collection%                        Collection du détecteur actif.
#
# Fichier d'une collection :
#   nom, objet, couleur     nom de la collection, d'un collectible, et leur couleur dans les messages
#   couleur-trace           couleur de la trace au sol (celle de « couleur » sinon)
#   actif                   false = fermée : rien à trouver, détecteur arrêté
#   permission              remplace « permission » de ce fichier ("" = tout le monde)
#   detecteur               false = pas de détecteur
#   particules              point de couleur autour des têtes pas encore trouvées : couleur, hauteur, hauteur-max (au
#                           hasard entre les deux), orbite (rayon, 0 = fixe)
#   trouve, complet         ce qui se passe à chaque tête, et à la dernière (à la place de « trouve ») :
#     chat                  lignes envoyées au joueur
#     titre                 texte, sous-titre, apparition, duree, disparition (ticks)
#     son                   « clé;volume;hauteur »
#     effets.objets         objets qui jaillissent : matieres, nombre, delai, hauteur, taille, montee-ticks, chute-ticks,
#                           sommet, ecart, son
#     effets.hologramme     lignes, ticks, hauteur
#     effets.feu-artifice   forme, couleurs, fondu, hauteur
#     commandes             lancées par la console
#   collectibles.<numéro>   lieu (monde x y z), zone (remplace celle de zones.yml), etapes (secours, voir
#                           detecteur.secours), trouve (remplace celui de la collection)
#   Textes et commandes : {joueur} {trouves} {total} {restants}, et les placeholders PlaceholderAPI.
#
# Un reload valide tous les fichiers avant de les appliquer : si l'un est invalide, rien ne change et le message le
# nomme. Demandent un redémarrage : serveur, base-de-donnees, alias-placeholders.
#
# ======================================================================== #

# Nom de ce serveur dans la base : plusieurs serveurs peuvent la partager.
serveur: serveur

base-de-donnees:
  hote: 127.0.0.1
  port: 3306
  base: minecraft
  utilisateur: utilisateur
  mot-de-passe: "CHANGE_ME"
  connexions: 3

# Permission exigée pour trouver les têtes d'une collection et se servir de son détecteur ("" = tout le monde).
permission: "shcollectibles.collection.{collection}"

# Modes de jeu dans lesquels rien ne se trouve.
modes-refuses:
  - SPECTATOR
  - ADVENTURE

# Autre nom accepté pour les placeholders (%autre_total_found_objects_<c>%…). Vide = aucun.
alias-placeholders: ""

# Distance de visée de /shcollectibles add et remove, en blocs.
admin-portee: 6

# Particules des têtes pas encore trouvées : distance de vue en blocs, ticks entre deux points, points par tour d'orbite,
# taille des points.
particules:
  distance: 20
  intervalle-ticks: 5
  orbite-pas: 10
  taille: 1.0

detecteur:
  # Commande lancée par le joueur à l'activation quand il n'est pas dans un monde où il reste des collectibles
  # (vide = aucune).
  commande-autre-monde: "spawn"

  # Têtes regardées toutes les « verification-secondes » : le détecteur n'emmène pas vers une tête pas posée.
  verification-secondes: 10

  # Collections différentes qu'un joueur peut suivre par jour (0 = sans limite) ; celle du jour se reprend librement. Le
  # jour change à « heure » (0 à 23, heure du serveur).
  # « collectibles-par-jour » : collectibles vers lesquels le détecteur mène un joueur par jour (0 = sans limite). Un
  # collectible compte quand le joueur entre dans sa zone de fouille, une seule fois par jour. Limite atteinte : le
  # détecteur finit de guider vers ceux qui ont compté, puis s'arrête jusqu'au jour suivant. Sans lui, on peut toujours
  # chercher et trouver les autres.
  limite:
    par-jour: 1
    collectibles-par-jour: 3
    heure: 0

  # Distances en blocs à marcher.
  distances:
    # La zone de fouille commence à moins de « proche » blocs du collectible, la flèche revient au-delà de « loin ».
    proche: 35
    loin: 42
    # La cible change pour un collectible plus proche seulement s'il l'est d'au moins « changement » blocs.
    changement: 20
    # Un déplacement plus grand d'un coup est une téléportation : le chemin est repris de zéro.
    teleportation: 30

  # Flèche approchée : elle mène chaque joueur vers un point à « ecart-min » à « ecart » blocs à plat du collectible (et à
  # « hauteur » blocs de haut au plus), d'où l'on rejoint le collectible en « marche-max » blocs à pied au plus. Quand la
  # flèche s'en va, continuer tout droit ne mène donc pas pile au collectible. « points » : nombre de ces points par
  # collectible, pris dans des directions bien écartées ; chaque joueur tombe toujours sur le même (relancer le détecteur ne
  # change rien). La zone de fouille, la barre et le bruit restent mesurés au vrai collectible. ecart 0 = la flèche mène pile
  # au collectible. Chaque point garde un chemin en mémoire (environ 0,3 Mo pour une carte de 100 000 cases).
  approximation:
    ecart: 5
    ecart-min: 3
    hauteur: 4
    marche-max: 12
    points: 3

  # Zone de fouille : la flèche s'en va (texte fleche.fin), un titre le dit et une barre en haut de l'écran dit si l'on
  # chauffe. Textes : section fouille de messages.yml.
  fouille:
    actif: true
    # Même à moins de « proche » blocs, la flèche reste tant qu'un double saut mène à ce nombre de blocs du collectible au
    # moins (un saut qui se pose plus près fait partie de la fouille). -1 = la flèche s'en va quand même.
    apres-double-saut: 5
    # Titre, en ticks, et son de l'entrée (vide = aucun).
    titre:
      apparition: 5
      duree: 45
      disparition: 15
    son: "minecraft:item.spyglass.use;1;1"
    barre:
      actif: true
      # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12 ou NOTCHED_20
      style: NOTCHED_6
    # Blocs à repasser pour redescendre d'un niveau.
    marge: 1.5
    # Niveaux, affichés à moins de « distance » blocs à marcher (le plus loin vaut pour toute la zone) : couleur PINK, BLUE,
    # RED, GREEN, YELLOW, PURPLE ou WHITE, et remplissage de la barre (0 à 1). Un seul niveau = la barre n'aide pas.
    niveaux:
      tiede:
        distance: 1000
        couleur: BLUE
        remplissage: 0.33
      chaud:
        distance: 14
        couleur: YELLOW
        remplissage: 0.66
      brulant:
        distance: 7
        couleur: RED
        remplissage: 1.0

  # Bruit du collectible cherché, joué à sa place : « clé;volume;hauteur » (le volume 1 s'entend jusqu'à 16 blocs),
  # seulement quand il reste moins de « portee » blocs à marcher, donc jamais à travers un mur.
  bruit:
    son: "minecraft:block.note_block.hat;1;1.4"
    intervalle-ticks: 80
    portee: 10

  # Secours : sans carte (monde pas encore lu, collectible qu'aucun chemin n'atteint), la flèche suit les « etapes » du
  # collectible dans l'ordre, l'entrée de sa zone en dernier, puis va droit vers lui.
  secours:
    # Une étape est passée à « rayon » blocs à plat et « hauteur » blocs de haut.
    rayon: 4
    hauteur: 4
    # Une étape est sautée quand le joueur est à la hauteur de la suivante (à « depasse-hauteur » près) et nettement plus
    # près d'elle (moins de « depasse-part » de la distance entre les deux).
    depasse-hauteur: 3
    depasse-part: 0.6
    # Le joueur est déjà dans la zone : à l'abri du ciel (lumière du ciel au plus « abri-lumiere »), à « zone-hauteur »
    # blocs de haut du collectible au plus, et à moins de « zone-part » de la distance entre l'entrée et lui.
    zone-hauteur: 8
    zone-part: 0.8
    abri-lumiere: 4
    # L'entrée revient quand il est ressorti à plus de « ressorti » blocs d'elle, une étape quand il s'en est éloigné de
    # « retour » blocs de plus.
    ressorti: 16
    retour: 10

# Chemins à pied. Le plugin lit le monde autour des collectibles qui ont un détecteur, puis garde les chemins.
guidage:
  actif: true

  carte:
    # Lecture du monde après le démarrage, puis tronçons lus et sortes de blocs classées par tick (la lecture est étalée,
    # le calcul est fait à part).
    delai-demarrage-secondes: 60
    troncons-par-tick: 4
    blocs-par-tick: 400
    # Blocs lus autour de la boîte qui contient les collectibles, les départs et les raccourcis.
    marge: 40
    marge-dessous: 20
    marge-dessus: 30
    # Lieux d'où l'on part à pied (monde x y z), en plus du point de départ du monde et des raccourcis. Un endroit qu'on
    # n'atteint qu'en se téléportant doit être ici.
    departs: []
    # Boîtes où le chemin ne passe jamais (monde x1 y1 z1 x2 y2 z2), par exemple une arène.
    interdits: []
    # Blocs traversés malgré leur forme, et blocs jamais traversés ni montés (noms du jeu).
    blocs-ouverts: []
    blocs-fermes: []

  # Coût de chaque déplacement, en blocs de marche : plus il est grand, plus le chemin fait un détour pour l'éviter.
  # -1 = jamais (chute, porte-fermee, double-saut).
  deplacements:
    saut: 0.5
    # Saut par-dessus un trou : coût, coût en plus quand le trou est profond (plus que « chute-libre », ou le vide), et
    # longueur la plus grande en blocs (1 à 6).
    trou: 3
    trou-profond: 15
    trou-max: 4
    # Chute de plus de « chute-libre » blocs : coût, coût par bloc, et hauteur la plus grande.
    chute-libre: 3
    chute: 8
    chute-par-bloc: 0.5
    chute-max: 60
    # Coût en plus par bloc au-delà de « chute-haute-des » (chute ou double saut vers le bas).
    chute-haute-des: 12
    chute-haute: 1
    echelle: 1.5
    nage: 1.5
    porte-fermee: 6
    # Coût en plus par bloc marché sur des feuilles : le chemin ne passe pas par le haut des arbres.
    feuillage: 4
    # Double saut : coût, plus un coût par bloc, et un coût en plus quand l'arrivée est étroite. -1 sur un serveur sans
    # double saut.
    double-saut: 40
    double-saut-par-bloc: 2.5
    double-saut-etroit: 20
    # Ce que franchit un double saut : hauteur la plus grande, longueur la plus grande au même niveau, longueur perdue par
    # bloc quand on se pose plus haut, gagnée par bloc quand on se pose plus bas (« gain-max » au plus).
    double-saut-hauteur: 4
    double-saut-longueur: 11
    double-saut-perte-montee: 0.75
    double-saut-gain-descente: 0.16
    double-saut-gain-max: 5
    # On se pose à « bord » blocs du bord de l'arrivée ; elle est étroite en dessous de 1 bloc, sûre à « large » blocs.
    double-saut-bord: 1.5
    double-saut-large: 2.5
    # Vitesses qu'il donne, en blocs par tick : vers le haut et vers l'avant (celles du plugin de double saut).
    double-saut-puissance: 0.8
    double-saut-elan: 1.0
    # Mondes où il existe (vide = tous), et boîtes où il est coupé (monde x1 y1 z1 x2 y2 z2).
    double-saut-mondes: []
    sans-double-saut: []

  # Passages que le plugin ne voit pas (portail, téléporteur, trou à ramper), dans un seul sens. « rayon » : distance à
  # laquelle on est dessus (1.6 s'il manque).
  # liens:
  #   exemple:
  #     de: "world 10 64 10"
  #     vers: "world 100 70 -20"
  #     cout: 5
  #     rayon: 1.6
  liens: {}

  # Commandes qui rapprochent : proposées au-dessus de la flèche quand elles font gagner au moins « gain » blocs. « lieu »
  # est l'endroit où la commande amène.
  # raccourcis:
  #   exemple:
  #     commande: "warp exemple"
  #     lieu: "world 100 64 100"
  #     gain: 60
  raccourcis: {}

  suivi:
    # Chemin d'un joueur recalculé tous les « intervalle-ticks », et dès qu'il se pose. En l'air il ne change pas, au plus
    # « en-l-air-ticks » (un saut n'y change donc rien).
    intervalle-ticks: 5
    en-l-air-ticks: 80
    # Cases du chemin regardées d'avance, et nombre de points (changements de direction) donnés à la flèche.
    vue: 48
    points-max: 10
    # Distance des yeux à laquelle on clique une tête.
    portee-clic: 3.6
    # Le joueur est rattaché au chemin le plus proche : sous lui, puis autour de lui, en blocs (autour : 6 au plus), puis
    # plus loin encore (retrouve-autour, 16 au plus). Sans rien, l'ancien chemin est gardé « perdu-ticks ».
    recherche-dessous: 12
    recherche-autour: 3
    retrouve-autour: 10
    perdu-ticks: 100

  # Double saut sur le chemin : annoncé au-dessus de la flèche à moins de « annonce » blocs de l'élan, avec une ligne de
  # points de l'élan à l'arrivée et un cercle où se poser, montrés à ce joueur seulement.
  double-saut:
    annonce: 8
    # Hauteur du sommet de la ligne au-dessus du plus haut des deux bouts du saut.
    sommet: 3
    trace:
      actif: true
      intervalle-ticks: 5
      # Écart entre les points, nombre le plus grand, taille, et rayon du cercle (0 = sans).
      ecart: 0.8
      points-max: 30
      taille: 1.0
      cercle: 0.9
      # Couleur (#RRGGBB) ; vide = celle de la collection.
      couleur: "#FFD83D"

  # Trace au sol, montrée à ce joueur seulement : blocs du chemin dessinés, ticks entre deux passages, taille et hauteur
  # des points, distance du joueur au premier point.
  trace:
    actif: false
    blocs: 12
    intervalle-ticks: 8
    taille: 0.8
    hauteur: 0.3
    debut: 1.5
