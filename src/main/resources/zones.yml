# Zones comptées par %shcollectibles_zone_<zone>% (par exemple dans un codex). Une zone est une liste de boîtes
# « monde x1 y1 z1 x2 y2 z2 » (deux coins, dans n'importe quel ordre). Un collectible appartient à la première zone, dans
# l'ordre de ce fichier, dont une boîte contient sa tête ; « zone: <zone> » dans la collection l'emporte.
# /shcollectibles zones montre le résultat, /shcollectibles reload l'applique.
zones:
  exemple:
    - "world -50 0 -50 50 100 50"
